<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MMC</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Barlow:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        padding: 0;
        margin: 0;
      }
      body {
        background-color: #0d0d0d;
      }
      :root {
      }
      h1 {
        font-size: clamp(3.5rem, 12vw, 8rem);
        font-family: "Barlow Condensed";
        font-weight: 900;
        color: white;
        line-height: 0.95;
      }
      h2 {
        font-size: clamp(2.5rem, 6vw, 4.5rem);
      }
      h3 {
        font-size: 2.25rem;
      }
      h4 {
        font-size: 1.875rem;
      }
      h5 {
        font-size: 1.25rem;
        font-family: "DM Sans";
        color: #888888;
        font-weight: 500;
      }
      h6 {
        font-size: 1.125rem;
      }
      p {
        font-size: 0.75rem;
        color: #888888;
      }
      p.big {
        font-size: 1.4rem;
      }
      p.small {
        font-size: 0.875rem;
      }
      p.smaller {
        font-size: 0.8rem;
      }
      #hero {
        position: relative;
        display: flex;
        justify-content: center;
        flex-wrap: nowrap;
        align-items: center;
        flex-direction: column;
        min-height: 100vh;
        background: #0d0d0d;
        overflow: hidden;
        gap: 2vw;
      }

      #hero::before {
        content: "";
        position: absolute;
        inset: 0;
        background: radial-gradient(
          ellipse 60vw 40vw at 50% 50%,
          #e31e240a 0%,
          #0d0d0d 100%
        );
        pointer-events: none;
        z-index: 0;
      }

      .glow-orb {
        position: absolute;
        top: 50%;
        left: 50%;
        border-radius: 50%;
        background: radial-gradient(circle, #e31e24 0%, transparent 70%);
        filter: blur(40px);
        mix-blend-mode: screen;
        pointer-events: none;
        z-index: 0;
      }

      #orb-1 {
        width: 45vw;
        height: 45vw;
      }

      #orb-2 {
        width: 30vw;
        height: 30vw;
      }

      .hero-logo,
      .hero-text,
      .hero-desc,
      .hero-btn,
      .scroll-ele {
        position: relative;
        z-index: 1;
      }

      .mainlogo {
        width: 15vw;
      }
      .hero-text {
        width: 40vw;
        text-align: center;
      }
      .hero-desc {
        width: 40vw;
        text-align: center;
      }
      .hero-btn {
        display: flex;
        align-items: center;
        gap: 2vw;
      }

      .hero-btn-chld {
        font-family: "Barlow Condensed";
        font-weight: 700;
        font-size: 0.875rem;
        letter-spacing: 0.104vw;
        border: 0.078vw solid white;
        padding: 0.5vw 0.85vw;
        color: white;
        text-decoration: none;
        width: 10vw;
        text-align: center;
        box-sizing: border-box;

        & img {
          width: 1vw;
          position: relative;
          top: 0.14vw;
        }
      }
      .red-btn {
        background-color: red;
        border: 1px solid red !important;
      }
      .scroll-ele {
        width: 0.052vw;
        border: 0.052vw solid #888888;
        background-color: #888888;
        border-radius: 20vw;
        height: 10vh;
      }

      .scroll-ele::before {
        display: block;
        content: "SCROLL";
        width: 5vw;
        color: #888888;
        font-family: "DM Sans", sans-serif;
        letter-spacing: 2px;
        position: relative;
        top: 6vw;
        text-align: center;
        left: -2.083vw;
      }

      .scroll-ele::after {
        display: block;
        content: "↓";
        width: 2vw;
        color: #888888;
        position: relative;
        text-align: center;
        left: -0.938vw;
        top: 6vw;
      }
    </style>
  </head>
  <body>
    <section id="hero">
      <div class="glow-orb" id="orb-1"></div>
      <div class="glow-orb" id="orb-2"></div>

      <div class="hero-logo">
        <img src="src/mmcLogo.png" alt="MMC" class="mainlogo" />
      </div>
      <div class="hero-text">
        <h1>MSU <span style="color: red">MUSIC</span> CLUB</h1>
      </div>
      <div class="hero-desc">
        <h5>
          Where passion meets performance. MMC is the heartbeat of music culture
          at Management & Science University.
        </h5>
      </div>
      <div class="hero-btn">
        <a href="" class="hero-btn-chld red-btn discover">DISCOVER MMC</a>
        <a href="" class="hero-btn-chld">UPCOMING EVENTS</a>
      </div>
      <div class="scroll-ele"></div>
    </section>
    <section id="about"></section>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script>
      function animateOrb(
        selector,
        { minScale, maxScale, minOpacity, maxOpacity, drift, duration }
      ) {
        const el = document.querySelector(selector);

        gsap.set(el, {
          xPercent: -50,
          yPercent: -50,
          scale: minScale,
          opacity: minOpacity,
        });

        gsap
          .timeline({
            repeat: -1,
            yoyo: true,
            defaults: { ease: "sine.inOut" },
          })
          .to(el, { scale: maxScale, opacity: maxOpacity, duration });

        gsap.to(el, {
          x: () => gsap.utils.random(-drift, drift),
          y: () => gsap.utils.random(-drift, drift),
          duration: duration * 1.2,
          ease: "sine.inOut",
          repeat: -1,
          yoyo: true,
        });
      }

      animateOrb("#orb-1", {
        minScale: 0.85,
        maxScale: 1.25,
        minOpacity: 0.18,
        maxOpacity: 0.45,
        drift: 40,
        duration: 3,
      });

      animateOrb("#orb-2", {
        minScale: 1.1,
        maxScale: 0.75,
        minOpacity: 0.12,
        maxOpacity: 0.3,
        drift: 60,
        duration: 5,
      });

      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
        gsap.globalTimeline.pause();
      }
    </script>
  </body>
</html>
