<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MMC</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Barlow:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        padding: 0;
        margin: 0;
      }
      body {
        background-color: #0d0d0d;
      }
      :root {
      }
      h1 {
        font-size: clamp(3.5rem, 12vw, 8rem);
        font-family: "Barlow Condensed";
        font-weight: 900;
        color: white;
        line-height: 0.95;
      }
      h2 {
        font-size: clamp(2.5rem, 6vw, 4.5rem);
      }
      h3 {
        font-size: 2.25rem;
      }
      h4 {
        font-size: 1.875rem;
      }
      h5 {
        font-size: 1.25rem;
        font-family: "DM Sans";
        color: #888888;
        font-weight: 500;
      }
      h6 {
        font-size: 1.125rem;
      }
      p {
        font-size: 0.75rem;
        color: #888888;
      }
      p.big {
        font-size: 1.4rem;
      }
      p.small {
        font-size: 0.875rem;
      }
      p.smaller {
        font-size: 0.8rem;
      }
      #hero {
        display: flex;
        justify-content: center;
        flex-wrap: nowrap;
        align-items: center;
        flex-direction: column;
        min-height: 100vh;
        background: radial-gradient(
          ellipse 50vw 30vw at 50% 50%,
          #e31e241f 7%,
          #0d0d0d 100%
        );
        gap: 2vw;

        animation: pulseGlow 12s ease-in-out infinite;
      }

      @keyframes pulseGlow {
        0%,
        100% {
          background: radial-gradient(
            ellipse 40vw 20vw at 50% 50%,
            #e31e2415 0%,
            #0d0d0d 100%
          );
        }

        50% {
          background: radial-gradient(
            ellipse 70vw 45vw at 50% 50%,
            #e31e2450 0%,
            #0d0d0d 100%
          );
        }
      }

      .mainlogo {
        width: 15vw;
      }
      .hero-text {
        width: 40vw;
        text-align: center;
      }
      .hero-desc {
        width: 40vw;
        text-align: center;
      }
      .hero-btn {
        display: flex;
        align-items: center;
        gap: 2vw;
      }

      .hero-btn-chld {
        font-family: "Barlow Condensed";
        font-weight: 700;
        font-size: 0.875rem;
        letter-spacing: 0.104vw;
        border: 0.078vw solid white;
        padding: 0.5vw 0.85vw;
        color: white;
        text-decoration: none;
        width: 10vw;
        text-align: center;
        box-sizing: border-box;

        & img {
          width: 1vw;
          position: relative;
          top: 0.14vw;
        }
      }
      .red-btn {
        background-color: red;
        border: 1px solid red !important;
      }
      .scroll-ele {
        width: 0.052vw;
        border: 0.052vw solid #888888;
        height: 10vh;
      }

      .scroll-ele::before {
        display: block;
        content: "SCROLL";
        width: 5vw;
        color: #888888;
        font-family: "DM Sans", sans-serif;
        letter-spacing: 2px;
        position: relative;
        top: 6vw;
        text-align: center;
        left: -2.083vw;
      }

      .scroll-ele::after {
        display: block;
        content: "↓";
        width: 2vw;
        color: #888888;
        position: relative;
        text-align: center;
        left: -0.938vw;
        top: 6vw;
      }
    </style>
  </head>
  <body>
    <section id="hero">
      <div class="hero-logo">
        <img src="src/mmcLogo.png" alt="MMC" class="mainlogo" />
      </div>
      <div class="hero-text">
        <h1>MSU <span style="color: red">MUSIC</span> CLUB</h1>
      </div>
      <div class="hero-desc">
        <h5>
          Where passion meets performance. MMC is the heartbeat of music culture
          at Management & Science University.
        </h5>
      </div>
      <div class="hero-btn">
        <a href="" class="hero-btn-chld red-btn discover">DISCOVER MMC</a>
        <a href="" class="hero-btn-chld">UPCOMING EVENTS</a>
      </div>
      <div class="scroll-ele"></div>
    </section>
    <section id="about"></section>
  </body>
</html>
